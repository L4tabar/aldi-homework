name: On demand and after merge tests + lint

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional base URL for tests"
        required: false
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task-2-and-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: task-2-and-3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  ui-tests:
    needs: lint
    runs-on: ubuntu-latest
    environment: TEST

    defaults:
      run:
        working-directory: task-2-and-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: task-2-and-3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        env:
          BASE_URL: ${{ vars.BASE_URL != '' && vars.BASE_URL || github.event.inputs.base_url }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: npm run test:ui

      - name: Publish JUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Tests
          path: task-2-and-3/junit/results.xml
          reporter: java-junit

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: task-2-and-3/playwright-report
          if-no-files-found: warn
